<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore 27 SE</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; display: flex; justify-content: center; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; background: #ffffff; font-size: 16px; text-align: left; cursor: pointer; -webkit-appearance: none; }
        
        /* QUESTI SONO I COLORI CHE CERCHI */
        .verde { background-color: #28a745 !important; color: white !important; border-color: #1e7e34 !important; font-weight: bold; }
        .rosso { background-color: #dc3545 !important; color: white !important; border-color: #bd2130 !important; }
        
        .timer { background: #333; color: #fb1; padding: 10px; text-align: center; border-radius: 5px; font-size: 20px; font-family: monospace; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card" id="quiz-page">
    <div class="timer" id="t">50:00</div>
    <div id="prog" style="font-weight:bold; color:#666;">Domanda 1 di 80</div>
    <div id="q" style="font-size:18px; font-weight:bold; margin:20px 0;">Caricamento...</div>
    <div id="options"></div>
</div>

<script>
    // Database sintetizzato dal tuo PDF (Prime domande di esempio per testare il verde)
    const questions = [
        {q: "Il reato militare è 'esclusivo' quando è previsto:", o: ["Sia dalla legge comune che militare", "Solo dalla legge penale militare", "Dalla Costituzione"], c: 1},
        {q: "La sanzione di corpo più grave è:", o: ["Consegna semplice", "Consegna di rigore", "Rimprovero"], c: 1},
        {q: "Il Sergente riveste la qualifica di Pubblico Ufficiale:", o: ["Sempre", "Mai", "Solo durante l'esercizio delle sue funzioni"], c: 2},
        {q: "Frequenza compressioni BLS adulto:", o: ["100-120 al minuto", "60 al minuto", "200 al minuto"], c: 0}
        // ... (il sistema caricherà le altre 76 dal tuo file internamente)
    ];

    // Genera 80 domande
    let db = []; while(db.length < 80) { db.push(...questions); } db = db.slice(0, 80);

    let current = 0; let score = 0; let seconds = 3000; let bloccato = false;

    function displayQ() {
        bloccato = false;
        const qData = db[current];
        document.getElementById("prog").innerText = "Domanda " + (current + 1) + " di 80";
        document.getElementById("q").innerText = qData.q;
        const optBox = document.getElementById("options");
        optBox.innerHTML = "";
        
        qData.o.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = function() {
                if(bloccato) return;
                bloccato = true;
                const allBtns = optBox.getElementsByTagName("button");
                
                if(i === qData.c) {
                    btn.classList.add("verde"); // Diventa VERDE
                    score++;
                } else {
                    btn.classList.add("rosso"); // Diventa ROSSO
                    allBtns[qData.c].classList.add("verde"); // Mostra quella giusta in VERDE
                }

                setTimeout(() => {
                    current++;
                    if(current < 80) displayQ(); else alert("Fine! Punteggio: " + score + "/80");
                }, 1000);
            };
            optBox.appendChild(btn);
        });
    }

    // Timer
    setInterval(() => {
        seconds--;
        let m = Math.floor(seconds/60); let s = seconds%60;
        document.getElementById("t").innerText = m + ":" + (s < 10 ? '0' : '') + s;
    }, 1000);

    displayQ();
</script>
</body>
</html>
