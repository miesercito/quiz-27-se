<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore 27° SE - Interattivo</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #004a99; padding-bottom: 10px; }
        .timer { background: #333; color: #fb1; padding: 8px 12px; border-radius: 5px; font-family: monospace; font-size: 20px; font-weight: bold; }
        .info { font-size: 14px; color: #666; font-weight: bold; }
        .question { font-size: 17px; font-weight: bold; margin: 20px 0; color: #1c1e21; line-height: 1.4; min-height: 50px; }
        .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 15px; text-align: left; cursor: pointer; transition: 0.3s; }
        
        /* Classi per i colori */
        .correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724 !important; font-weight: bold; }
        .wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24 !important; }
        
        #result-page { display: none; text-align: center; }
        .score-big { font-size: 40px; color: #004a99; margin: 10px 0; }
    </style>
</head>
<body>

<div class="card" id="quiz-page">
    <div class="header">
        <div class="info" id="prog">Domanda 1 di 80</div>
        <div class="timer" id="t">50:00</div>
    </div>
    <div class="question" id="q">Caricamento domande...</div>
    <div id="options"></div>
</div>

<div class="card" id="result-page">
    <h2>Test Concluso</h2>
    <p>Punteggio totale:</p>
    <div class="score-big" id="final-score">0/80</div>
    <button onclick="location.reload()" class="btn" style="text-align:center; background:#004a99; color:white; font-weight:bold;">Ricomincia Simulazione</button>
</div>

<script>
    const questions = [
        {q: "Il reato militare è 'esclusivo' quando è previsto:", o: ["Sia dalla legge comune che militare", "Solo dalla legge penale militare", "Dalla Costituzione"], c: 1},
        {q: "La legge penale militare di pace si applica:", o: ["Solo in tempo di guerra", "Ai militari in servizio e a quelli in congedo per i reati commessi in servizio", "Solo agli ufficiali"], c: 1},
        {q: "L'insubordinazione con violenza è un reato contro:", o: ["Il patrimonio", "Il servizio", "La persona (il superiore)"], c: 2},
        {q: "Cosa si intende per 'diserzione'?", o: ["Assenza arbitraria superiore a 5 giorni", "Ritardo di 1 ora", "Uscire senza divisa"], c: 0},
        {q: "Il reato di 'peculato militare' riguarda l'appropriazione di:", o: ["Beni di civili", "Denaro o beni dell'Amministrazione Militare", "Armi nemiche"], c: 1},
        {q: "La sanzione di corpo della 'consegna semplice' può durare:", o: ["Da 1 a 7 giorni", "Da 1 a 15 giorni", "Solo 1 giorno"], c: 1},
        {q: "La consegna di rigore comporta il divieto di uscire:", o: ["Solo di notte", "Dalla caserma o dall'alloggio per tutto il tempo della sanzione", "Solo se piove"], c: 1},
        {q: "Chi infligge la sanzione della consegna semplice?", o: ["Il Comandante di Corpo", "Ogni superiore", "Solo il Ministro"], c: 1},
        {q: "Le ricompense si dividono in:", o: ["Soli elogi", "Morali (Elogi/Encomi) e al Valore/Merito", "Soli aumenti di stipendio"], c: 1},
        {q: "Il Sergente riveste la qualifica di Pubblico Ufficiale:", o: ["Nell'esercizio delle sue funzioni e in servizio", "Mai", "Sempre, 24 ore su 24"], c: 0},
        {q: "In caso di arresto cardiaco, la prima operazione è:", o: ["Chiamare i soccorsi e valutare la sicurezza", "Iniziare la respirazione bocca a bocca", "Cercare acqua"], c: 0},
        {q: "Il massaggio cardiaco si esegue con una frequenza di:", o: ["100-120 compressioni al minuto", "60 compressioni al minuto", "200 compressioni al minuto"], c: 0},
        {q: "Il rapporto tra compressioni e ventilazioni nel BLS adulto è:", o: ["15:2", "30:2", "5:1"], c: 1},
        {q: "La manovra di Heimlich si usa per:", o: ["Fratture", "Ostruzione delle vie aeree", "Annegamento"], c: 1},
        {q: "Un rifiuto è 'speciale' se prodotto da:", o: ["Civili abitazioni", "Attività agricole, artigianali e sanitarie", "Giardini pubblici"], c: 1},
        {q: "Il codice CER è composto da:", o: ["3 cifre", "6 cifre (tre coppie)", "10 cifre"], c: 1},
        {q: "I rifiuti pericolosi sono identificati da:", o: ["Un bollino verde", "Un asterisco (*) nel codice CER", "Una lettera X"], c: 1},
        {q: "Il registro di carico e scarico rifiuti va conservato per:", o: ["10 anni", "3 anni", "1 anno"], c: 1},
        {q: "Cosa indica il termine 'Sottufficiale di Corpo'?", o: ["Il grado più alto", "Una figura di collegamento tra truppa e Comandante di Corpo", "Un medico"], c: 1},
        {q: "L'avanzamento dei Sergenti può avvenire:", o: ["Solo per anzianità", "Per anzianità o a scelta", "Solo per concorso"], c: 1},
        {q: "La G.U.S. (Grande Uniforme Storica) si usa:", o: ["Ogni giorno", "Per cerimonie solenni", "Durante le esercitazioni"], c: 1},
        {q: "Il superiore ha l'obbligo di informare l'inferiore prima di una sanzione?", o: ["Sì, per permettergli la difesa", "No, è facoltativo", "Solo se l'inferiore lo richiede"], c: 0},
        {q: "Il diritto di sciopero è consentito ai militari?", o: ["Sì", "No, è vietato", "Solo fuori dall'orario di lavoro"], c: 1},
        {q: "La 'disobbedienza' è un reato militare quando:", o: ["Si rifiuta un ordine del superiore", "Si dimentica lo zaino", "Si arriva in ritardo"], c: 0},
        {q: "La 'consegna di rigore' è annotata:", o: ["Solo su un foglio volante", "Sui documenti matricolari", "Mai"], c: 1},
        {q: "Il soccorritore deve proteggersi dai liquidi biologici usando:", o: ["Niente", "Guanti monouso", "Occhiali da sole"], c: 1},
        {q: "La profondità del massaggio cardiaco deve essere:", o: ["Circa 5-6 cm", "Almeno 10 cm", "2 cm"], c: 0},
        {q: "Se il DAE dice 'Scarica non consigliata', cosa fare?", o: ["Spegnere tutto", "Continuare subito la RCP (compressioni)", "Aspettare l'ambulanza stando fermi"], c: 1},
        {q: "Il soccorso a un soffocato cosciente prevede:", o: ["5 colpi dorsali e 5 compressioni addominali", "Solo acqua", "Metterlo disteso"], c: 0},
        {q: "I rifiuti sanitari a rischio infettivo vanno in:", o: ["Contenitori gialli rigidi", "Sacchetti neri", "Cassonetti della carta"], c: 0},
        {q: "Il rifiuto ingombrante è:", o: ["Un rifiuto tossico", "Un rifiuto che non entra nei normali cassonetti", "Un rifiuto leggero"], c: 1},
        {q: "Il Sergente Maggiore è un grado dei:", o: ["Ufficiali", "Sergenti", "Graduati"], c: 1},
        {q: "Il militare deve osservare il segreto d'ufficio?", o: ["Sempre", "Solo se lo decide lui", "Solo in guerra"], c: 0},
        {q: "L'abbandono di posto è punito:", o: ["Dal Codice Penale Militare di Pace", "Dal Codice Civile", "Solo con un rimprovero"], c: 0},
        {q: "Il 'Comandante di Corpo' è di norma un:", o: ["Colonnello o grado equivalente", "Caporal Maggiore", "Sottotenente"], c: 0},
        {q: "Le ricompense al valore servono a:", o: ["Premiare atti di coraggio eccezionale", "Pagare meno tasse", "Andare in pensione prima"], c: 0},
        {q: "Il militare deve mantenere la divisa in ordine:", o: ["Solo se vede un Generale", "Sempre, come dovere di decoro", "Solo il lunedì"], c: 1},
        {q: "Il fumo è vietato nei locali della Pubblica Amministrazione?", o: ["Sì, sempre", "No, solo se ci sono civili", "Si può fumare ovunque"], c: 0},
        {q: "In caso di ustione, la prima cosa da fare è:", o: ["Mettere ghiaccio tritato", "Mettere acqua corrente fresca (non gelata)", "Mettere olio"], c: 1},
        {q: "Lo 'stato di shock' si riconosce da:", o: ["Pelle calda e rossa", "Pelle pallida, sudore freddo, polso rapido", "Paziente che grida forte"], c: 1},
        {q: "Chi è il responsabile della disciplina in un reparto?", o: ["Il Comandante", "L'ultimo arrivato", "Il cappellano"], c: 0},
        {q: "Il procedimento disciplinare deve concludersi entro:", o: ["90 giorni", "2 anni", "10 giorni"], c: 0},
        {q: "Un rifiuto 'urbano' è:", o: ["Prodotto da attività domestiche", "Un residuo di esplosivo", "Solo quello liquido"], c: 0},
        {q: "Il superiore può punire un inferiore per fatti della vita privata?", o: ["No, mai", "Sì, se ledono il prestigio dell'istituzione o sono reati", "Solo se l'inferiore è antipatico"], c: 1},
        {q: "L'obbedienza deve essere:", o: ["Pronta, leale e responsabile", "Lenta", "Solo se l'ordine piace"], c: 0},
        {q: "Nel BLS, 'GAS' significa:", o: ["Guarda, Ascolta, Senti", "Gira, Alza, Sposta", "Gridare Aiuto Sempre"], c: 0},
        {q: "La RCP su un bambino piccolo si esegue con:", o: ["Due dita o una mano", "Due mani pesanti", "Nessuna pressione"], c: 0},
        {q: "La legge 152/2006 riguarda:", o: ["I Sergenti", "L'Ambiente", "Le Pensioni"], c: 1},
        {q: "I rifiuti pericolosi hanno caratteristiche:", o: ["Solo di cattivo odore", "Infiammabili, tossiche o corrosive", "Di grandi dimensioni"], c: 1},
        {q: "L'elogio è trascritto sul libretto personale?", o: ["Sì", "No", "Solo se lo chiede il militare"], c: 0},
        {q: "Il superiore può revocare una sanzione?", o: ["Sì, se è stata inflitta erroneamente", "No, mai", "Solo se glielo ordina il tribunale"], c: 0},
        {q: "Il reato di 'rivolta' richiede il concorso di almeno:", o: ["4 militari", "2 militari", "10 militari"], c: 0},
        {q: "L'abbandono di comando è un reato:", o: ["Militare", "Comune", "Amministrativo"], c: 0},
        {q: "La sanzione del richiamo è:", o: ["Solo verbale o scritta, ma è la più lieve", "Molto grave", "Annotata in matricola"], c: 0},
        {q: "Le compressioni addominali sono anche dette:", o: ["Manovra di Heimlich", "RCP", "Manovra di Valsalva"], c: 0},
        {q: "Il DAE è uno strumento:", o: ["Manuale", "Semiautomatico o automatico", "Solo per ospedali"], c: 1},
        {q: "I rifiuti della caserma sono assimilati a:", o: ["Rifiuti urbani", "Rifiuti spaziali", "Nessuna categoria"], c: 0},
        {q: "Il reato di insubordinazione può avvenire:", o: ["Solo in caserma", "Ovunque, se il militare è in servizio o per motivi di servizio", "Solo all'estero"], c: 1},
        {q: "Chi è l'autorità che decide sulla consegna di rigore?", o: ["Il Comandante di Corpo su proposta", "Il Sergente di giornata", "Il Sindaco"], c: 0},
        {q: "La disciplina militare serve a:", o: ["Punire tutti", "Garantire l'efficienza delle FF.AA.", "Rendere tristi i soldati"], c: 1},
        {q: "In caso di emorragia, il laccio emostatico (tourniquet):", o: ["Si usa sempre", "Si usa solo come ultima spiaggia per emorragie massive agli arti", "Non si usa mai"], c: 1},
        {q: "Un militare può essere punito se omette di salutare un superiore?", o: ["Sì, è una mancanza disciplinare", "No", "Solo se il superiore è un Generale"], c: 0},
        {q: "Il registro dei rifiuti deve essere numerato e vidimato?", o: ["Sì", "No", "Dipende dalla caserma"], c: 0},
        {q: "Le pile scariche sono:", o: ["Rifiuti urbani pericolosi", "Rifiuti organici", "Rifiuti inerti"], c: 0},
        {q: "La consegna di rigore dura da:", o: ["1 a 15 giorni", "15 a 30 giorni", "1 a 7 giorni"], c: 0},
        {q: "Il Sergente Maggiore Capo è:", o: ["Il grado apicale dei Sergenti", "Un giovane soldato", "Un Ufficiale superiore"], c: 0},
        {q: "In caso di frattura esposta bisogna:", o: ["Toccare l'osso", "Coprire con garza sterile e non muovere", "Spingere l'osso dentro"], c: 1},
        {q: "Il militare può partecipare a riunioni politiche in divisa?", o: ["Sì", "No, è assolutamente vietato", "Solo se autorizzato dal partito"], c: 1},
        {q: "Quale sigla indica le manovre di rianimazione?", o: ["BLS-D", "ABC", "GPS"], c: 0},
        {q: "Il militare deve avere cura della propria persona?", o: ["Sì, capelli e barba devono essere in ordine", "No, può fare come vuole", "Solo se va in ufficio"], c: 0},
        {q: "Il 'Catalogo Europeo dei Rifiuti' serve a:", o: ["Vendere i rifiuti", "Classificare i rifiuti con un codice", "Nascondere i rifiuti"], c: 1},
        {q: "Le sanzioni disciplinari di stato sono più gravi di quelle di corpo?", o: ["Sì", "No", "Sono uguali"], c: 0},
        {q: "Chi è il superiore diretto del Sergente in un plotone?", o: ["Il Comandante di Plotone", "Il Comandante di Reggimento", "Il Generale"], c: 0},
        {q: "L'omissione di soccorso è un reato?", o: ["Sì, previsto dal Codice Penale", "No", "Solo per i medici"], c: 0},
        {q: "I rifiuti inerti sono ad esempio:", o: ["Macerie da costruzione", "Avanzi di cibo", "Medicine"], c: 0},
        {q: "La 'Mancanza alla chiamata' è un reato militare?", o: ["Sì", "No", "Solo se dura un mese"], c: 0},
        {q: "L'encomio è superiore all'elogio?", o: ["Sì", "No", "Sono la stessa cosa"], c: 0},
        {q: "Il militare deve presentare ricorso gerarchico entro:", o: ["30 giorni", "1 anno", "5 giorni"], c: 0},
        {q: "La sanzione disciplinare ha scopo:", o: ["Educativo e di mantenimento della disciplina", "Di vendetta", "Economico"], c: 0},
        {q: "Il simulatore per il 27° Sergenti serve a:", o: ["Studiare e superare il test", "Perdere tempo", "Guardare video"], c: 0}
    ];

    let current = 0;
    let score = 0;
    let seconds = 50 * 60;
    let canClick = true;

    function startTimer() {
        const tDiv = document.getElementById("t");
        const interval = setInterval(() => {
            seconds--;
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            tDiv.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
            if (seconds <= 0) { clearInterval(interval); finish(); }
        }, 1000);
    }

    function displayQ() {
        if (current >= 80) { finish(); return; }
        canClick = true;
        const q = questions[current];
        document.getElementById("prog").innerText = `Domanda ${current + 1} di 80`;
        document.getElementById("q").innerText = q.q;
        const optBox = document.getElementById("options");
        optBox.innerHTML = "";
        
        q.o.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(i, btn);
            optBox.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        if (!canClick) return;
        canClick = false;
        const q = questions[current];
        const buttons = document.querySelectorAll(".btn");
        
        if (selected === q.c) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
            buttons[q.c].classList.add("correct"); // Mostra quella giusta
        }

        setTimeout(() => {
            current++;
            displayQ();
        }, 1200); // Aspetta 1.2 secondi prima di passare alla prossima
    }

    function finish() {
        document.getElementById("quiz-page").style.display = "none";
        document.getElementById("result-page").style.display = "block";
        document.getElementById("final-score").innerText = `${score}/80`;
    }

    startTimer();
    displayQ();
</script>

</body>
</html>
