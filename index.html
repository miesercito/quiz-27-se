<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulatore 27� Sergenti</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 100%; max-width: 600px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #004a99; padding-bottom: 10px; margin-bottom: 20px; }
        #timer { font-size: 24px; font-weight: bold; color: #d9534f; }
        .question { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .option { display: block; width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; text-align: left; font-size: 16px; background: #fff; }
        .option:hover { background: #f0f7ff; border-color: #004a99; }
        #result { text-align: center; display: none; }
        .btn-reset { background: #004a99; color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-box">
        <div class="header">
            <h2 style="color:#004a99; margin:0;">27� SE Quiz</h2>
            <div id="timer">50:00</div>
        </div>
        <div id="progress" style="margin-bottom:10px; color:#666;">Domanda 1 di 80</div>
        <div class="question" id="qText">Caricamento...</div>
        <div id="options"></div>
    </div>

    <div id="result">
        <h2>Test Completato!</h2>
        <h1 id="scoreDisplay" style="font-size: 50px; color: #004a99;">0/80</h1>
        <button class="btn-reset" onclick="location.reload()">Ricomincia</button>
    </div>
</div>

<script>
    // Database sintetizzato dal file 27 Serg
    const questions = [
        {q: "Secondo il Codice Penale Militare, il reato � esclusivamente militare quando:", o: ["� previsto anche dalla legge comune", "Non � previsto dalla legge penale comune", "Riguarda solo i civili"], c: 1},
        {q: "La Legge Penale Militare � considerata 'Speciale' perch�:", o: ["Tutela diritti privati", "Salvaguarda l'efficienza delle FF.AA.", "Si applica solo in tempo di guerra"], c: 1},
        {q: "Il Codice Penale Militare di Pace � composto da:", o: ["2 Libri", "3 Libri", "4 Libri"], c: 1},
        {q: "In caso di emorragia esterna grave, la prima azione da compiere �:", o: ["Disinfettare la ferita", "Compressione diretta sulla ferita", "Somministrare acqua"], c: 1},
        {q: "La definizione di 'Rifiuto' � contenuta nel:", o: ["D.L. 152/2006", "Codice Penale", "Regolamento di Disciplina"], c: 0},
        {q: "Chi � il 'Detentore' del rifiuto?", o: ["Chi lo smaltisce", "Il produttore o chi ne � in possesso", "Lo Stato"], c: 1},
        {q: "La sigla CER nell'ambito dei rifiuti significa:", o: ["Codice Emergenza Rifiuti", "Catalogo Europeo dei Rifiuti", "Centro Estrazione Risorse"], c: 1},
        {q: "L'elogio deve essere trascritto:", o: ["Solo se richiesto dal militare", "Sui documenti matricolari", "Mai"], c: 1}
    ];

    // Genera 80 domande per il simulatore
    let fullDb = [];
    while(fullDb.length < 80) {
        fullDb.push(...questions.map(item => ({...item})));
    }
    fullDb = fullDb.slice(0, 80);

    let current = 0;
    let score = 0;
    let seconds = 50 * 60;

    function startTimer() {
        const tDiv = document.getElementById("timer");
        const interval = setInterval(() => {
            seconds--;
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            tDiv.innerText = ${m}:${s < 10 ? '0' : ''}${s};
            if (seconds <= 0) { clearInterval(interval); finish(); }
        }, 1000);
    }

    function displayQ() {
        const q = fullDb[current];
        document.getElementById("progress").innerText = Domanda ${current + 1} di 80;
        document.getElementById("qText").innerText = q.q;
        const optBox = document.getElementById("options");
        optBox.innerHTML = "";
        q.o.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option";
            btn.innerText = opt;
            btn.onclick = () => {
                if(i === q.c) score++;
                current++;
                if(current < 80) displayQ(); else finish();
            };
            optBox.appendChild(btn);
        });
    }

    function finish() {
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("scoreDisplay").innerText = ${score}/80;
    }

    // Avvio immediato
    startTimer();
    displayQ();
</script>

</body>
</html>
